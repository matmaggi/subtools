<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferramentas de legendagem</title>
<meta name="description" content="Ferramentas para revisar, buscar, comparar e organizar legendas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1318;
  --panel:#171d24;
  --line:#2a323c;
  --text:#eef0f2;
  --muted:#98a3af;
  --sub:#ffd84a;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  line-height:1.5;min-height:100vh;
  padding:clamp(16px,4vw,48px);
}
.wrap{max-width:960px;margin:0 auto}

/* Topo compacto */
.hero{
  display:grid;grid-template-columns:1fr auto;gap:20px 32px;align-items:center;
  padding:clamp(18px,3vw,28px) clamp(20px,3.5vw,36px);
  border-radius:14px;border:1px solid var(--line);
  background:
    radial-gradient(100% 140% at 100% 0%,#25313f 0%,transparent 60%),
    #12171d;
}
.hero h1{
  color:var(--sub);text-transform:uppercase;
  font-weight:900;font-size:clamp(1.9rem,5.2vw,3.2rem);
  line-height:1.02;letter-spacing:-.02em;
}
.hero p{color:var(--muted);max-width:40ch;margin-top:10px}
.art{width:clamp(180px,28vw,260px);height:auto;display:block}

.bar{display:flex;justify-content:flex-end;margin:16px 0 4px}
.search{
  flex:0 1 260px;width:100%;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font:inherit;padding:10px 14px;border-radius:10px;
}
.search::placeholder{color:var(--muted)}
.search:focus-visible{outline:2px solid var(--sub);outline-offset:2px}

/* Lista de ferramentas */
.tools{list-style:none;padding:0;display:grid;gap:10px;margin-top:8px}
.tool{
  display:grid;grid-template-columns:52px 1fr auto;gap:6px 18px;align-items:center;
  padding:18px 20px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
  color:inherit;text-decoration:none;
  transition:border-color .15s,background .15s;
}
.tool:hover{border-color:var(--sub);background:#1b222a}
.tool:focus-visible{outline:2px solid var(--sub);outline-offset:3px}
.mark{
  width:52px;height:52px;border-radius:10px;
  display:grid;place-items:center;
  background:#000;color:var(--sub);
  font-weight:900;font-size:1.15rem;letter-spacing:-.03em;
}
.name{font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.desc{color:var(--muted);font-size:.95rem}
.tag{
  font-size:.8rem;color:var(--sub);border:1px solid #5a4f1c;
  padding:2px 10px;border-radius:999px;white-space:nowrap;justify-self:end;
}
.tool .info{min-width:0}
.go{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);display:grid;place-items:center;
  color:var(--muted);transition:transform .15s,color .15s,border-color .15s;
}
.tool:hover .go{color:var(--sub);border-color:var(--sub);transform:translateX(3px)}
.side{display:flex;align-items:center;gap:14px}
.empty{color:var(--muted);padding:24px 4px}
footer{margin-top:40px;color:var(--muted);font-size:.85rem}

@media (max-width:560px){
  .tool{grid-template-columns:44px 1fr;padding:16px}
  .mark{width:44px;height:44px}
  .hero{grid-template-columns:1fr}
  .art{display:none}
  .side{grid-column:1 / -1;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  .tool,.go{transition:none}
}
</style>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div>
      <h1>Ferramentas</h1>
      <h1>de legendagem</h1>
      <p>Revise, busque, compare e organize legendas. Escolha uma ferramenta para abrir.</p>
    </div>
    <svg class="art" viewBox="0 0 260 170" fill="none" role="img" aria-label="Vídeo com legendas e linha do tempo">
      <rect x="6" y="6" width="248" height="118" rx="10" fill="#0a0d11" stroke="#2f3946" stroke-width="2"/>
      <path d="M6 96 70 56l44 30 38-22 102 52v8H16a10 10 0 0 1-10-10z" fill="#18222c"/>
      <circle cx="206" cy="36" r="12" fill="#232f3b"/>
      <circle cx="130" cy="52" r="20" fill="#000" fill-opacity=".55" stroke="#ffd84a" stroke-width="2"/>
      <path d="M124 43v18l15-9z" fill="#ffd84a"/>
      <rect x="52" y="86" width="156" height="12" rx="3" fill="#000" fill-opacity=".8"/>
      <rect x="58" y="90" width="144" height="4" rx="2" fill="#ffd84a"/>
      <rect x="74" y="102" width="112" height="12" rx="3" fill="#000" fill-opacity=".8"/>
      <rect x="80" y="106" width="100" height="4" rx="2" fill="#eef0f2"/>
      <rect x="6" y="136" width="248" height="28" rx="6" fill="#171d24" stroke="#2a323c"/>
      <rect x="14" y="143" width="52" height="14" rx="3" fill="#ffd84a"/>
      <rect x="72" y="143" width="38" height="14" rx="3" fill="#ffd84a" fill-opacity=".45"/>
      <rect x="116" y="143" width="66" height="14" rx="3" fill="#ffd84a"/>
      <rect x="188" y="143" width="58" height="14" rx="3" fill="#ffd84a" fill-opacity=".45"/>
      <path d="M112 132v36" stroke="#eef0f2" stroke-width="2"/>
      <path d="M107 132h10l-5 7z" fill="#eef0f2"/>
    </svg>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Filtrar ferramentas" aria-label="Filtrar ferramentas" autocomplete="off">
  </div>

  <ul class="tools" id="list"></ul>
  <p class="empty" id="empty" hidden>Nenhuma ferramenta encontrada. Tente outro termo.</p>

  <footer>As ferramentas abrem em páginas separadas.</footer>
</main>

<script>
/* Para adicionar uma ferramenta, inclua um novo item nesta lista. */
const TOOLS = [
  {
    name: "RevTitles",
    desc: "Verificação ortográfica de legendas e revisão por IA",
    url: "https://matmaggi.github.io/revtitles/",
    tag: "Revisão"
  },
  {
    name: "SearchTitles",
    desc: "Buscador de termos em legendas (template e tradução) para contexto",
    url: "https://matmaggi.github.io/searchtitles/",
    tag: "Busca"
  },
    {
    name: "Ler-gendas",
    desc: "Ouça o texto das suas legendas para encontrar erros",
    url: "https://matmaggi.github.io/ler-gendas/",
    tag: "Áudio"
  },
  {
    name: "Comparador de Legendas",
    desc: "Compare as mudanças de duas legendas em detalhes",
    url: "https://matmaggi.github.io/comparadordelegendas/",
    tag: "Comparação"
  },
  {
    name: "ExcelTitles",
    desc: "Gere uma planilha com as legendas (template e tradução) alinhadas",
    url: "https://matmaggi.github.io/exceltitles/",
    tag: "Planilha"
  }
];

const list = document.getElementById("list");
const empty = document.getElementById("empty");
const q = document.getElementById("q");

const initials = n => {
  const w = n.split(/\s+/);
  const caps = n.match(/[A-Z]/g);
  return (caps && caps.length >= 2 ? caps.slice(0, 2).join("") : w.map(x => x[0]).join("").slice(0, 2)).toUpperCase();
};

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(items){
  list.innerHTML = items.map(t => `
    <li>
      <a class="tool" href="${esc(t.url)}" rel="noopener">
        <div class="mark" aria-hidden="true">${esc(initials(t.name))}</div>
        <div class="info">
          <div class="name">${esc(t.name)}</div>
          <div class="desc">${esc(t.desc)}</div>
        </div>
        <div class="side">
          ${t.tag ? `<span class="tag">${esc(t.tag)}</span>` : ""}
          <span class="go" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </span>
        </div>
      </a>
    </li>`).join("");
  empty.hidden = items.length > 0;
}

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

q.addEventListener("input", () => {
  const term = norm(q.value.trim());
  render(TOOLS.filter(t => norm(`${t.name} ${t.desc} ${t.tag || ""}`).includes(term)));
});

render(TOOLS);
</script>
</body>
</html>
